name: Release + Publish

on: [workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.metadata.outputs.released }}
      version: ${{ steps.metadata.outputs.version }}
      extension-file: ${{ steps.metadata.outputs.extension-file }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Generate changelog and bump version
        id: metadata
        run: |
          previous_version=$(node -p "require('./package.json').version")
          npm run changelog -- --bump
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "$previous_version" ]; then
            echo 'No release-worthy commits.'
            echo 'released=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'released=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          name=$(node -p "require('./package.json').name")
          echo "extension-file=$name-$version.vsix" >> "$GITHUB_OUTPUT"
          awk -v heading="## v$version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Package extension
        if: steps.metadata.outputs.released == 'true'
        run: npm run package

      - name: Commit and tag release
        if: steps.metadata.outputs.released == 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:${{ github.event.repository.default_branch }}" "refs/tags/v$VERSION"

      - name: Upload extension artifact
        if: steps.metadata.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.metadata.outputs.extension-file }}
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.metadata.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          EXTENSION_FILE: ${{ steps.metadata.outputs.extension-file }}
        run: |
          display_name=$(node -p "require('./package.json').displayName")
          gh release create "v$VERSION" "$EXTENSION_FILE" --verify-tag --title "$display_name v$VERSION" --notes-file release-notes.md

  publish-openvsx:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ needs.release.outputs.extension-file }}

  publish-vscode-marketplace:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish to Visual Studio Marketplace
        env:
          EXTENSION_FILE: ${{ needs.release.outputs.extension-file }}
        run: npx --no-install vsce publish --oidc --packagePath "$EXTENSION_FILE"
